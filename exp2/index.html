<!DOCTYPE html>
<html>
<head>
<title>Employee Management System</title>
<link rel="stylesheet" href="2.css">
</head>

<body>

<div class="container">

<h2>Employee Management System</h2>

<label>Employee Name:</label>
<input type="text" id="name">
<br><br>

<label>Employee ID:</label>
<input type="number" id="id">
<br><br>

<label>Employee Salary:</label>
<input type="number" id="salary">
<br><br>

<label>Employee Department:</label>
<input type="text" id="dept">
<br><br>

<button class="addbtn" onclick="addEmployee()">Add Employee</button>

<br><br>

<div class="buttons">

<button onclick="displayEmployees()">Display All</button>

<button onclick="filterSalary()">Salary > 50000</button>

<button onclick="totalSalary()">Total Salary</button>

<button onclick="averageSalary()">Average Salary</button>

<button onclick="countDepartment()">Count Department</button>

</div>

<br><br>

<div id="result"></div>

</div>

<script src="2.js"></script>

</body>
</html>
