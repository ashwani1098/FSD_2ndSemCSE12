<br><br>

<button onclick="checkPrime()">Check</button>

<h3 id="result"></h3>

</div>

<script>

function checkPrime(){

let n=Number(document.getElementById("num").value);

let prime=true;

if(n<2){
prime=false;
}

for(let i=2;i<n;i++){
if(n%i==0){
prime=false;
break;
}
}

if(prime){
document.getElementById("result").innerHTML="Prime Number";
}
else{
document.getElementById("result").innerHTML="Not Prime Number";
}

}
</script>

</body>

function startTimer(){

let sec=Number(document.getElementById("time").value);

let timer=setInterval(function(){

document.getElementById("result").innerHTML=sec;

if(sec<0){
clearInterval(timer);
document.getElementById("result").innerHTML="Time Up!";
}

},1000);

}
