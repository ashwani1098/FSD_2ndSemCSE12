<!DOCTYPE html>
<html>
<head>
    <title>DOM Experiment</title>
    <link rel="stylesheet" href="3.css">
</head>
<body>

<div class="container">

    <h1 id="heading">Original Heading</h1>

    <input type="text" id="inputText" placeholder="Enter message">

    <p id="para">This is a paragraph.</p>

    <br><br>

    <div class="button-group">
        <button id="btnText">Change Heading</button>
        <button id="btnColor">Toggle Background</button>
        <button id="btnSize">Toggle Font Size</button>
        <button id="btnToggle">Show/Hide Paragraph</button>
    </div>

    <button id="btnReset">Reset</button>

</div>

<script src="3.js"></script>

</body>
</html>
